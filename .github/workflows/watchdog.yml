name: watchdog
# Kiểm tra độc lập (ngoài Cloudflare) mỗi ~15 phút: nếu bộ chạy lịch ngừng hoặc app không phản hồi thì job thất bại
# → GitHub gửi email báo lỗi workflow tới chủ repo. Lưu ý: GitHub tự tắt workflow theo lịch sau 60 ngày repo không có hoạt động.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Chỉ để thử: địa chỉ khác thay cho app thật"
        required: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi /api/health
        env:
          URL: ${{ inputs.url || 'https://wifi-nha.giadinhxuan.workers.dev/api/health?by=watchdog' }}
        run: |
          code=000
          for i in 1 2 3; do
            code=$(curl -sS -A "Mozilla/5.0 (wifi-nha-watchdog)" -o health.json -w "%{http_code}" --max-time 20 "$URL" || echo 000)
            [ "$code" = "200" ] && { cat health.json; exit 0; }
            sleep 20
          done
          echo "::error::WiFi Nhà không khoẻ (HTTP $code)"
          cat health.json 2>/dev/null || true
          exit 1
