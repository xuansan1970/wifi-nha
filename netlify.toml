# App đã chuyển sang Cloudflare Workers (wifi-nha.giadinhxuan.workers.dev).
# Netlify chỉ còn chuyển hướng link cũ; không còn functions / cron để không điều khiển router song song.
[build]
  publish = "netlify-redirect"
  functions = "netlify-redirect/no-functions"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
