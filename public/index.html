<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F2FC" id="metaTheme">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>WiFi Nhà</title>

<script>
(()=>{try{const q=new URLSearchParams(location.search).get("theme");const t=(q==="light"||q==="dark")?q:(localStorage.getItem("nm_theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));document.documentElement.dataset.theme=t;if(window.parent!==window)document.documentElement.classList.add("embed");document.documentElement.style.colorScheme=t;localStorage.setItem("nm_theme",t)}catch(e){}})();
</script>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/parent.css">
<link rel="stylesheet" href="/nm-glass.css">
<link rel="stylesheet" href="/nm-skin.css">

<script src="/nm-fx.js" defer data-rise=".card,.kpi,.pz-key,.gw-card,.cam-card" data-tilt=".kpi,.gw-card,.pz-key,.cam-card" data-tilt-max="7" data-swap=".main" data-ripple=".btn,.pz-key,.keypad button,.tabbar button" data-press="button,.btn"></script>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="/app.js"></script>
<script src="/faceid.js"></script>
<script src="/news.js"></script>
<script src="/parent.js"></script>
<script src="/views.js"></script>
<script src="/insight.js"></script>

</body>
</html>
