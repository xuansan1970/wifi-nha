name = "wifi-nha"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/app.js", "/app.css", "/sw.js", "/"]

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"
