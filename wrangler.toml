name = "wifi-nha"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/app.js", "/faceid.js", "/news.js", "/app.css", "/parent.js", "/parent.css", "/views.js", "/insight.js", "/sw.js", "/"]

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "872ca36b7a544ddda82d53cda297523b"

# Nơi lưu dữ liệu chính (thay KV: KV gói Free chỉ 1.000 lần ghi/ngày)
[[durable_objects.bindings]]
name = "STORE"
class_name = "StoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreDO"]
